name: apt repository

# At each release: build the jamai package, attach it to the release, add it to the apt repository
# (the gh-pages branch, served at https://apt.gmusicassembly.com), sign the repository, publish.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Build the package
        run: packaging/deb/build.sh

      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/jamai_*_all.deb --clobber

      - name: Check out the published repository
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages:gh-pages
            git worktree add site gh-pages
          else
            git worktree add --detach site
            cd site && git checkout --orphan gh-pages && git rm -rf -q .
          fi

      - name: Add the package and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.JAMAI_APT_SIGNING_KEY }}
        run: packaging/apt/build-repo.sh site dist/jamai_*_all.deb

      - name: Publish
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new to publish"; exit 0; fi
          git commit -q -m "jamai $(cat ../VERSION)"
          git push origin gh-pages
